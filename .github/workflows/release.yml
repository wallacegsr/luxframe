name: Release

# Pushing a tag like v0.1.0 builds the bundle and attaches it to a GitHub
# release, which is where HACS downloads luxframe.js from. The release notes
# are the version's section of CHANGELOG.md, which Home Assistant shows with
# the update; the release fails if the changelog has no section for the tag.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/luxframe.js
          body_path: ${{ runner.temp }}/release-notes.md
          # Adds the "Full Changelog" link below the notes.
          generate_release_notes: true
