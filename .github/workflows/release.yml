name: Release

# Pushing a tag like v0.1.0 builds the bundle and attaches it to a GitHub
# release, which is where HACS downloads luxframe.js from.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/luxframe.js
          generate_release_notes: true
